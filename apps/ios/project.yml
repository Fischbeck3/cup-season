# Cup Season — the phone (D99). XcodeGen manifest; `xcodegen generate` writes
# CupSeason.xcodeproj, which is gitignored — this file is the project.
#
# Two local packages carry everything that is not a screen:
#   Packages/CSDesign      the design system (generated tokens + markers,
#                          typography, components)
#   Packages/CupSeasonKit  domain + data (generated RPC contract, the
#                          Supabase service with the encoded rules, session,
#                          repositories)
# The app target holds only views and the composition root.
name: CupSeason
options:
  bundleIdPrefix: app.cupseason
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "26.0"

packages:
  CSDesign:
    path: Packages/CSDesign
  CupSeasonKit:
    path: Packages/CupSeasonKit

settings:
  base:
    # The App ID, the APNs key and the AASA already carry this team (D98 "what
    # survives"). Automatic signing needs only that it is SET — the one thing
    # the failed expo run:ios was missing.
    DEVELOPMENT_TEAM: 3F7BK4WVH8
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  CupSeason:
    type: application
    platform: iOS
    sources:
      - path: CupSeason
        excludes: ["Info.plist"]
    dependencies:
      - package: CSDesign
      - package: CupSeasonKit
      - target: CupSeasonWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cupseason.ios
        PRODUCT_NAME: CupSeason
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"          # iPhone only — IOS-014
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # D152 · declared here, HANDED OUT by AppDelegate only while a live
        # round is up (OrientationGate). Declaring it is not the same as
        # allowing it everywhere.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: CupSeason/Info.plist
      properties:
        CFBundleDisplayName: Cup Season
        CFBundleName: Cup Season
        # Without these two lines the generated plist carries the literal
        # `1` / `1.0`: ios-archive.sh's CURRENT_PROJECT_VERSION only reached
        # CSBuild, so every TestFlight upload after the first was rejected as a
        # duplicate build. Both now follow the build settings, like CSBuild.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        # D155 · the round on the lock screen and in the Dynamic Island.
        NSSupportsLiveActivities: true
        NSCameraUsageDescription: Cup Season reads your scorecard from a photo so you can post a round in seconds.
        NSPhotoLibraryUsageDescription: Cup Season attaches a photo to your round or your card. The marker always backs it up.
        # D156 · proximity is Bluetooth, never location. Advertising runs ONLY
        # while the Add-players screen is open and only after an explicit
        # opt-in; there is no background mode and there must never be one.
        NSLocalNetworkUsageDescription: Cup Season can see which of your golf buddies are standing on this tee, so the foursome fills itself. It never uses your location, and a phone that is not already your buddy or league mate stays invisible.
        NSBonjourServices:
          - _cs-tee._tcp
          - _cs-tee._udp
        UIAppFonts:
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
          - IBMPlexMono-SemiBold.ttf
        CFBundleURLTypes:
          - CFBundleURLName: app.cupseason.ios
            CFBundleURLSchemes: [cupseason]
        # The build stamp the door and Settings show — CLAUDE.md rule 2's
        # native equivalent. Set by CI/Xcode; never hand-edited in code.
        CSBuild: $(CURRENT_PROJECT_VERSION)
    entitlements:
      path: CupSeason/CupSeason.entitlements
      properties:
        # /?claim= and /?join= — the AASA on cupseason.app already lists this
        # app id (preflight check 9). ?share= is deliberately NOT claimed.
        com.apple.developer.associated-domains:
          - applinks:cupseason.app
        # APNs — the server side (device_tokens + the push function's APNs
        # branch) is built; M4 lights it.
        aps-environment: development
        # Sign in with Apple (IOS-023). The App ID capability + the Supabase
        # provider are the owner's; the button renders only behind the flag.
        com.apple.developer.applesignin:
          - Default

  # D155 · the Live Activity's home. It depends on CSDesign ONLY — the palette
  # comes from the same generated tokens the app uses, and an extension that
  # draws three facts has no business holding a Supabase client. The attributes
  # file is compiled into BOTH targets rather than living in a package, for the
  # same reason.
  CupSeasonWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: CupSeasonWidgets
      - path: CupSeason/Live/CSRoundActivity.swift
    dependencies:
      - package: CSDesign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cupseason.ios.widgets
        PRODUCT_NAME: CupSeasonWidgets
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    info:
      path: CupSeasonWidgets/Info.plist
      properties:
        CFBundleDisplayName: Cup Season
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  CupSeasonTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CupSeasonTests]
    dependencies:
      - target: CupSeason
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  CupSeason:
    build:
      targets:
        CupSeason: all
        CupSeasonWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CupSeasonTests
        - package: CSDesign/CSDesignTests
        - package: CupSeasonKit/CupSeasonKitTests

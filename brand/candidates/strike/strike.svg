<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" style="color:#D8B25A">
  <!-- Cup Season — STRIKE (2026-09-11). A typeface of our own for the mark: heavy monoline (12 on 40),
       terminals cut flat, skewX(-10), one slice at the club's angle through every mark. Letters are
       paths on a 40-unit grid, never a font file. The name set in it, then marks 11, 20, 33. -->
  <rect width="420" height="260" fill="#0A0E0C"/>
  <defs>
  <!-- ═══ STRIKE — the letterforms. 40 tall, baseline at +20, centre 0,0. Heavy monoline, flat-cut terminals, set with skewX(-10). Weight is the stroke: 12 on 40. ═══ -->
  <path id="k-C" d="M10.6-11A15 15 0 1 0 10.6 11"/>
  <path id="k-S" d="M13-12C7-20-14-18-14-7-14 4 14-1 14 8 14 19-8 21-13 12"/>
  <path id="k-U" d="M-13-20V6A13 13 0 0 0 13 6V-20"/>
  <path id="k-P" d="M-11 20V-20H4A11 11 0 0 1 4 2H-11"/>
  <path id="k-E" d="M12-20H-12V20H12M-12 0H8"/>
  <path id="k-A" d="M-16 20L0-20L16 20M-9 6H9"/>
  <path id="k-O" d="M-16 0A16 20 0 1 0 16 0A16 20 0 1 0-16 0"/>
  <path id="k-N" d="M-13 20V-20L13 20V-20"/>
  <!-- the two-letter mark, set: C then S, 8 apart -->
  <g id="CS" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="2.4" transform="skewX(-10)"><use href="#k-C" transform="translate(-19 0)"/><use href="#k-S" transform="translate(20 0)"/></g>
  <!-- the strike: one slice at the club's angle, applied as a mask to whatever carries the letters -->
  <mask id="strike"><rect x="-200" y="-200" width="600" height="600" fill="white"/><path d="M-60 34L60-34" stroke="black" stroke-width="3.4"/></mask>
  <mask id="strike33"><rect x="-200" y="-200" width="600" height="600" fill="white"/><path d="M-60 24.8L60-54" stroke="black" stroke-width="5"/></mask>
  <!-- the iron: hosel at the origin, toe along +x; grooves in the ground colour -->
  <g id="iron">
    <path d="M-2-16h4V11h-4z" fill="currentColor"/>
    <path d="M0 10L34 4Q40 3 40 10Q41 16 36 19Q20 24 2 22Q-1 22 0 10Z" fill="currentColor"/>
    <path d="M8 11.2L31 7.2M8 14.4L31 10.4M8 17.6L31 13.6" stroke="#0A0E0C" stroke-width="1.15" stroke-linecap="round"/>
  </g>
  <path id="pen" d="M0 0c8-4.4 16 4 24-.4v14.8c-8 4.4-16-4-24 .4z"/>
  <path id="topo1" d="M48 22c15 0 30 9 30 26s-15 26-30 26-30-9-30-26 15-26 30-26z" fill="none" stroke-width="1.6"/>
  <path id="topo2" d="M48 32c10 0 21 6 21 16s-11 18-21 18-19-8-19-18 9-16 19-16z" fill="none" stroke-width="1.6"/>
  <path id="topo3" d="M48 41c5 0 11 3 11 8s-6 9-11 9-10-4-10-9 5-8 10-8z" fill="none" stroke-width="1.6"/>
  <clipPath id="penclip"><path d="M0 0c8-4.4 16 4 24-.4v14.8c-8 4.4-16-4-24 .4z" transform="translate(20 20) scale(3)"/></clipPath>

  <!-- ═══ 11 · CS, IRONED — the club is the strike, threaded: over the C, under the S ═══ -->
  <g id="m11">
    <g transform="translate(48 47) scale(1.05)"><g mask="url(#strike33)"><g fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="butt" transform="skewX(-10)"><use href="#k-C" transform="translate(-19 0)"/></g></g></g>
    <path d="M17 52L78 12" stroke="currentColor" stroke-width="4.2" stroke-linecap="butt"/>
    <g transform="translate(22 62) rotate(-25) scale(.8)"><path d="M-2-16h4V11h-4z" fill="currentColor"/><path d="M0 10L34 4Q40 3 40 10Q41 16 36 19Q20 24 2 22Q-1 22 0 10Z" fill="currentColor"/><path d="M8 11.2L31 7.2M8 14.4L31 10.4M8 17.6L31 13.6" stroke="#0A0E0C" stroke-width="1.15" stroke-linecap="round"/></g>
    <g transform="translate(48 47) scale(1.05)"><g fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="butt" transform="skewX(-10)"><use href="#k-S" transform="translate(20 0)"/></g></g>
  </g>
  <!-- ═══ 20 · ON THE PENNANT — the tab band's flag at 3x, CS struck out of it, the strike letting the gold through ═══ -->
  <g id="m20">
    <rect x="12" y="14" width="6" height="70" rx="3" fill="currentColor"/>
    <use href="#pen" transform="translate(18 20) scale(3)" fill="currentColor"/>
    <g transform="translate(56 43) scale(.66)"><g mask="url(#strike)"><g fill="none" stroke="#0A0E0C" stroke-width="12" stroke-linecap="butt" transform="skewX(-10)"><use href="#k-C" transform="translate(-19 0)"/><use href="#k-S" transform="translate(20 0)"/></g></g></g>
  </g>
  <!-- ═══ 33 · TOPO PENNANT — the flag carries the course's contours, CS struck through them ═══ -->
  <g id="m33">
    <rect x="12" y="14" width="6" height="70" rx="3" fill="currentColor"/>
    <use href="#pen" transform="translate(18 20) scale(3)" fill="currentColor"/>
    <g clip-path="url(#penclip)" stroke="#0A0E0C" stroke-width="1.3"><g transform="translate(62 44) scale(.9) translate(-48 -48)"><use href="#topo1"/><use href="#topo2"/></g></g>
    <g transform="translate(57 43) scale(.58)"><g mask="url(#strike)"><g fill="none" stroke="#0A0E0C" stroke-width="12" stroke-linecap="butt" transform="skewX(-10)"><use href="#k-C" transform="translate(-19 0)"/><use href="#k-S" transform="translate(20 0)"/></g></g></g>
  </g>
  <!-- paper variants: the knockout colour is paper -->
  <g id="m20p">
    <rect x="12" y="14" width="6" height="70" rx="3" fill="currentColor"/>
    <use href="#pen" transform="translate(18 20) scale(3)" fill="currentColor"/>
    <g transform="translate(56 43) scale(.66)"><g mask="url(#strike)"><g fill="none" stroke="#F4F1E9" stroke-width="12" stroke-linecap="butt" transform="skewX(-10)"><use href="#k-C" transform="translate(-19 0)"/><use href="#k-S" transform="translate(20 0)"/></g></g></g>
  </g>
  <g id="m33p">
    <rect x="12" y="14" width="6" height="70" rx="3" fill="currentColor"/>
    <use href="#pen" transform="translate(18 20) scale(3)" fill="currentColor"/>
    <g clip-path="url(#penclip)" stroke="#F4F1E9" stroke-width="1.3"><g transform="translate(62 44) scale(.9) translate(-48 -48)"><use href="#topo1"/><use href="#topo2"/></g></g>
    <g transform="translate(57 43) scale(.58)"><g mask="url(#strike)"><g fill="none" stroke="#F4F1E9" stroke-width="12" stroke-linecap="butt" transform="skewX(-10)"><use href="#k-C" transform="translate(-19 0)"/><use href="#k-S" transform="translate(20 0)"/></g></g></g>
  </g>
  <g id="m11p">
    <g transform="translate(48 47) scale(1.05)"><g mask="url(#strike33)"><g fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="butt" transform="skewX(-10)"><use href="#k-C" transform="translate(-19 0)"/></g></g></g>
    <path d="M17 52L78 12" stroke="currentColor" stroke-width="4.2" stroke-linecap="butt"/>
    <g transform="translate(22 62) rotate(-25) scale(.8)"><path d="M-2-16h4V11h-4z" fill="currentColor"/><path d="M0 10L34 4Q40 3 40 10Q41 16 36 19Q20 24 2 22Q-1 22 0 10Z" fill="currentColor"/><path d="M8 11.2L31 7.2M8 14.4L31 10.4M8 17.6L31 13.6" stroke="#F4F1E9" stroke-width="1.15" stroke-linecap="round"/></g>
    <g transform="translate(48 47) scale(1.05)"><g fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="butt" transform="skewX(-10)"><use href="#k-S" transform="translate(20 0)"/></g></g>
  </g>
</defs>
  <g transform="translate(36 60) scale(.98)"><g fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="2.4" transform="skewX(-10)">
          <use href="#k-C" transform="translate(14 0)"/><use href="#k-U" transform="translate(50 0)"/><use href="#k-P" transform="translate(86 0)"/>
          <use href="#k-S" transform="translate(136 0)"/><use href="#k-E" transform="translate(172 0)"/><use href="#k-A" transform="translate(210 0)"/><use href="#k-S" transform="translate(250 0)"/><use href="#k-O" transform="translate(290 0)"/><use href="#k-N" transform="translate(328 0)"/>
        </g></g>
  <use href="#m11" transform="translate(30 130) scale(1.2)"/>
  <use href="#m20" transform="translate(160 130) scale(1.2)"/>
  <use href="#m33" transform="translate(290 130) scale(1.2)"/>
</svg>

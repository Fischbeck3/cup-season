<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!-- Cup Season master mark (D89) — the ember flag. Supersedes the four-arc
       orbit mark: the install icons, apple-touch icon and og-image had already
       moved to this flag, and the ring survived only in the favicon, the app
       header and this file — so the product disagreed with itself.
       Dark-background version. -->
  <defs>
    <linearGradient id="ember" x1="45" y1="21" x2="77" y2="53" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2A03D"/>
      <stop offset="1" stop-color="#FF5A2E"/>
    </linearGradient>
  </defs>
  <path d="M45 21 L77 37 L45 53 Z" fill="url(#ember)"/>
  <rect x="36" y="18" width="9" height="60" rx="4.5" fill="#F4F7F4"/>
</svg>

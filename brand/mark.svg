<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Cup Season master mark — the Tracer (2026-08-06). One shot falls out of
       the sky and lands in the flagged cup: the tapered comet is the ball
       flight, the pin stands proud, the cup catches both. Chosen because the
       sign-in door literally manufactures this frame (the Forge). Bare mark,
       dark grounds. Flat ember only — no gradient, ever. -->
  <g fill="#F4712E">
    <path d="M88 12 C 82 36, 70 59, 54 73 C 51 76, 47 75, 46 72 C 60 60, 73 38, 83 13 C 84 10, 87 9, 88 12 Z"/>
    <ellipse cx="38" cy="79" rx="17" ry="6.5"/>
    <rect x="27" y="13" width="10" height="68" rx="5"/>
    <path d="M36 13 L74 26 L36 39 Z"/>
  </g>
</svg>

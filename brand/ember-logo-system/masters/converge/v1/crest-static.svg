<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" fill="none" role="img" aria-labelledby="crTitle crDesc">
  <title id="crTitle">The Cup Season crest</title>
  <desc id="crDesc">Four tracers on the heat ramp — amber, ember, fire, white-hot — converge on a flag planted in the cup, rings spreading from where they land.</desc>
  <!-- STATIC EXTRACTION of the sign-in door's crest (index.html, Entry V4 /
       D76). Geometry copied exactly from the live animation so the art on a
       link preview and the art on the door are the same drawing, not two
       drawings that resemble each other. The animation is dropped; every
       tracer is shown landed and the ring is shown at rest.

       This is the KEY VISUAL. The mark is the ember flag (../../../mark.svg)
       and stays on every icon — see decision log D91. -->
  <defs>
    <radialGradient id="crGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5A2E" stop-opacity=".26"/>
      <stop offset="55%" stop-color="#FF5A2E" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#FF5A2E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="230" cy="238" rx="150" ry="44" fill="url(#crGlow)"/>
  <ellipse cx="230" cy="236" rx="118" ry="32" stroke="#FF5A2E" stroke-opacity=".10" stroke-width="1.5"/>
  <ellipse cx="230" cy="233" rx="78" ry="22" stroke="#FF5A2E" stroke-opacity=".18" stroke-width="1.5"/>
  <ellipse cx="230" cy="230" rx="44" ry="13" stroke="#FF5A2E" stroke-opacity=".30" stroke-width="1.5"/>

  <path d="M-24 96 C 80 118, 160 176, 224 224" stroke="#E9A23B" stroke-width="2.6" opacity=".85" stroke-linecap="round"/>
  <path d="M96 -20 C 140 66, 190 160, 227 222"  stroke="#FF5A2E" stroke-width="2.6" opacity=".85" stroke-linecap="round"/>
  <path d="M364 -20 C 320 66, 270 160, 233 222" stroke="#FF3B1A" stroke-width="2.6" opacity=".85" stroke-linecap="round"/>
  <path d="M484 96 C 380 118, 300 176, 236 224" stroke="#F0F2F3" stroke-width="2.6" opacity=".85" stroke-linecap="round"/>

  <ellipse cx="230" cy="226" rx="15" ry="5.5" fill="#0A0B0D" stroke="#332018" stroke-width="2"/>
  <path d="M236 223V120" stroke="#F0F2F3" stroke-width="4" stroke-linecap="round"/>
  <path d="M236 120l38 13-38 13z" fill="#FF5A2E"/>
  <circle cx="230" cy="224" r="4.5" fill="#F4F7F4"/>
  <ellipse cx="230" cy="226" rx="15" ry="5.5" stroke="#FF5A2E" stroke-width="1.5"/>
</svg>

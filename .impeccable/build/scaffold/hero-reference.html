<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: club-spread.png</title>
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#0e1818}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:853px">
  <div class="r-status region chrome" data-region="status"><!-- Native status bar with clock and system indicators --></div>
  <div class="r-masthead region text" data-region="masthead"><!-- Compete title in established condensed board face --><p style="line-height:1.05;margin:0">masthead</p></div>
  <div class="r-masthead-rule region chrome" data-region="masthead-rule"><!-- Neutral horizontal rule --></div>
  <div class="r-seasons-head region text" data-region="seasons-head"><!-- Your seasons section heading --><p style="line-height:1.05;margin:0">seasons-head</p></div>
  <div class="r-seasons-rule region chrome" data-region="seasons-rule"><!-- Neutral horizontal rule --></div>
  <figure class="r-league-photo region plate" data-region="league-photo"><img src="../plates/course.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-league-title-1 region text" data-region="league-title-1"><!-- League name, THE DEW SWEEPERS --><p style="line-height:1.05;margin:0">league-title-1</p></div>
  <div class="r-description-1 region text" data-region="description-1"><!-- Short league description: Early tee times. Long friendships. --><p style="line-height:1.05;margin:0">description-1</p></div>
  <div class="r-people-markers-1 region chrome" data-region="people-markers-1"><!-- Personal marker previews; production must preserve each real marker identity --></div>
  <div class="r-people-names-1 region text" data-region="people-names-1"><!-- Member names and remaining count: Tash, Dan +10 --><p style="line-height:1.05;margin:0">people-names-1</p></div>
  <div class="r-footer-rule-1 region chrome" data-region="footer-rule-1"><!-- Neutral horizontal rule above compact season facts --></div>
  <div class="r-phase-1 region text" data-region="phase-1"><!-- Current season phase: BEFORE FIRST TEE --><p style="line-height:1.05;margin:0">phase-1</p></div>
  <div class="r-standing-1 region text" data-region="standing-1"><!-- Compact factual season summary: OCT 11 --><p style="line-height:1.05;margin:0">standing-1</p></div>
  <div class="r-row-rule-1 region chrome" data-region="row-rule-1"><!-- Neutral horizontal rule between leagues --></div>
  <div class="r-emblem-field-2 region chrome" data-region="emblem-field-2"><!-- Flat two-color initial mark field using existing league palette --></div>
  <div class="r-emblem-letter-2 region text" data-region="emblem-letter-2"><!-- Designed initial letterforms, WTB --><p style="line-height:1.05;margin:0">emblem-letter-2</p></div>
  <div class="r-league-title-2 region text" data-region="league-title-2"><!-- League name, WHO’S THE BITCH? --><p style="line-height:1.05;margin:0">league-title-2</p></div>
  <div class="r-description-2 region text" data-region="description-2"><!-- Short league description: Two golfers. A season to settle it. --><p style="line-height:1.05;margin:0">description-2</p></div>
  <div class="r-people-markers-2 region chrome" data-region="people-markers-2"><!-- Personal marker previews; production must preserve each real marker identity --></div>
  <div class="r-people-names-2 region text" data-region="people-names-2"><!-- Member names and remaining count: You and Galen --><p style="line-height:1.05;margin:0">people-names-2</p></div>
  <div class="r-footer-rule-2 region chrome" data-region="footer-rule-2"><!-- Neutral horizontal rule above compact season facts --></div>
  <div class="r-phase-2 region text" data-region="phase-2"><!-- Current season phase: WEEK 8 OF 15 --><p style="line-height:1.05;margin:0">phase-2</p></div>
  <div class="r-standing-2 region text" data-region="standing-2"><!-- Compact factual season summary: 2nd · 15 PTS --><p style="line-height:1.05;margin:0">standing-2</p></div>
  <div class="r-season-support region text" data-region="season-support"><!-- Supported comparison: 4 back of Galen. --><p style="line-height:1.05;margin:0">season-support</p></div>
  <div class="r-row-rule-2 region chrome" data-region="row-rule-2"><!-- Neutral horizontal rule between leagues --></div>
  <div class="r-emblem-field-3 region chrome" data-region="emblem-field-3"><!-- Flat two-color initial mark field using existing league palette --></div>
  <div class="r-emblem-letter-3 region text" data-region="emblem-letter-3"><!-- Designed initial letterforms, TF --><p style="line-height:1.05;margin:0">emblem-letter-3</p></div>
  <div class="r-league-title-3 region text" data-region="league-title-3"><!-- League name, THE FELLAS --><p style="line-height:1.05;margin:0">league-title-3</p></div>
  <div class="r-description-3 region text" data-region="description-3"><!-- Short league description: Saturday golf, all season. --><p style="line-height:1.05;margin:0">description-3</p></div>
  <div class="r-people-markers-3 region chrome" data-region="people-markers-3"><!-- Personal marker previews; production must preserve each real marker identity --></div>
  <div class="r-people-names-3 region text" data-region="people-names-3"><!-- Member names and remaining count: You, Jade +6 --><p style="line-height:1.05;margin:0">people-names-3</p></div>
  <div class="r-footer-rule-3 region chrome" data-region="footer-rule-3"><!-- Neutral horizontal rule above compact season facts --></div>
  <div class="r-phase-3 region text" data-region="phase-3"><!-- Current season phase: WEEK 3 OF 26 --><p style="line-height:1.05;margin:0">phase-3</p></div>
  <div class="r-standing-3 region text" data-region="standing-3"><!-- Compact factual season summary: 1st · 25 PTS --><p style="line-height:1.05;margin:0">standing-3</p></div>
  <div class="r-row-rule-3 region chrome" data-region="row-rule-3"><!-- Neutral horizontal rule between leagues --></div>
  <div class="r-tabbar region chrome" data-region="tabbar"><!-- Existing five-target native tab bar, Compete selected, Play action tint; profile unchanged --></div>
  <div class="r-insert-spacing region chrome" data-region="insert-spacing"><!-- Page ground around the left identity insert --></div>
</main>
</body>
</html>
